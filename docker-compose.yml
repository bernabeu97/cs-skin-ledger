# CS 饰品账本部署（多人访问版）
# 用法：
#   docker compose up -d --build
# 环境变量：
#   MYSQL_ROOT_PASSWORD  MySQL root 密码（必填，勿用默认值）
#   DB_PASSWORD          ledger 账号密码（默认 ledger_pass，生产请修改）
#   CSQAQ_TOKEN          CSQAQ ApiToken（可选，配置后才有 UU/Steam/BUFF 行情）
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cs_skin_ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ${DB_PASSWORD:-ledger_pass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cs_skin_ledger?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USER: ledger
      DB_PASSWORD: ${DB_PASSWORD:-ledger_pass}
      CSQAQ_TOKEN: ${CSQAQ_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
