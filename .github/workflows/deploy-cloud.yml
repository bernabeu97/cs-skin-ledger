name: deploy-to-cloud

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests and package
        working-directory: backend
        run: |
          mvn -B test
          mvn -B -DskipTests package

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend quality gate and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          tar -C dist -czf ../frontend.tar.gz .

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "scripts/cloud-deploy.sh"
          target: "/tmp"

      - name: Upload artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "backend/target/skin-ledger-0.3.0.jar,frontend.tar.gz"
          target: "/tmp"

      - name: Run cloud deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            sudo bash /tmp/cloud-deploy.sh v0.3.0 /tmp/skin-ledger-0.3.0.jar /tmp/frontend.tar.gz
