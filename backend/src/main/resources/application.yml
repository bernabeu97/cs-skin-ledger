spring:
  application:
    name: skin-ledger
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cs_skin_ledger?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_SECURE_COOKIES:false}

app:
  security:
    # 生产环境必须通过 APP_ENCRYPTION_KEY 设置随机密钥。
    encryption-key: ${APP_ENCRYPTION_KEY:local-development-only-change-me}
    secure-cookies: ${APP_SECURE_COOKIES:false}
    admin-username: ${APP_ADMIN_USERNAME:}
    admin-password: ${APP_ADMIN_PASSWORD:}
  price:
    csqaq:
      api-token: ${CSQAQ_TOKEN:}
      base-url: https://api.csqaq.com
      timeout-seconds: 15
    steam:
      enabled: true
      delay-ms: 1100
      timeout-seconds: 12
    youpin:
      enabled: false
      token-file: work/uu_token.txt
      timeout-seconds: 12
    default-sources: uu
    refresh-interval-minutes: 0
    refresh-initial-delay-seconds: 300
