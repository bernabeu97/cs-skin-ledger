spring:
  application:
    name: skin-ledger
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cs_skin_ledger?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080

# ===== 行情模块（M2/M3）配置 =====
# 主数据源 CSQAQ：免费注册 https://csqaq.com 后复制 ApiToken，
# 并在个人中心把本机出口 IP 加入白名单；环境变量 CSQAQ_TOKEN 优先。
app:
  price:
    csqaq:
      api-token: ${CSQAQ_TOKEN:}
      base-url: https://api.csqaq.com
      timeout-seconds: 15
    steam:
      enabled: true
      delay-ms: 1100
      timeout-seconds: 12
    youpin:
      enabled: false
      token-file: work/uu_token.txt
      timeout-seconds: 12
    # 默认刷新平台：uu,steam,buff（来自 CSQAQ 时一次请求即可全部拿到）
    default-sources: uu,steam,buff
    # 定时刷新间隔（分钟），0 表示关闭；建议配置 CSQAQ 后再开启，避免被限流
    refresh-interval-minutes: 0
    # 启动后首次自动刷新延迟（秒）
    refresh-initial-delay-seconds: 300